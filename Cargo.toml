[workspace]
members = [
  "apps/oreak-plugin-runner",
  "apps/oreak-server",
  "apps/oreak-web",
  "crates/oreak-core",
  "crates/oreak-legacy",
  "crates/oreak-plugin-api",
  "crates/oreak-project",
  "crates/oreak-protocol",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
