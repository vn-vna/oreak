[package]
name = "oreak-plugin-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
readme = "README.md"

[dependencies]
mlua = { version = "0.11.4", features = ["lua54", "vendored", "serialize"] }
oreak-plugin-api = { path = "../../crates/oreak-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
