[package]
name = "bootstrap"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
command-group = { version = "5", features = ["with-tokio"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
